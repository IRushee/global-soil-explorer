[project]
name = "global-soil-explorer-backend"
version = "0.1.0"
description = "Backend logic for Global Soil Explorer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"backend" = "."}
packages = [
    "backend.domain",
    "backend.domain.value_objects",
    "backend.application",
    "backend.contracts",
    "backend.repository",
    "backend.spatial",
    "backend.processing",
    "backend.shared",
    "backend.config",
    "backend.interfaces",
    "backend.api",
    "backend.api.routers",
    "backend.api.schemas",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
